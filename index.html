<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性癖之瓶 - 情侣探索</title>
    <style>
        :root {
            --bg: #faf7f2;
            --card-bg: #fffdf9;
            --text: #3d3535;
            --text-light: #6b5e5e;
            --text-muted: #9a8c8c;
            --accent: #c97d7d;
            --accent-soft: #e8c4c4;
            --glass: rgba(255, 255, 255, 0.55);
            --shadow-sm: 0 2px 8px rgba(60, 40, 30, 0.06);
            --shadow-md: 0 4px 16px rgba(60, 40, 30, 0.1);
            --shadow-lg: 0 8px 32px rgba(60, 40, 30, 0.14);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 24px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(210,170,150,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 20%, rgba(200,160,140,0.08) 0%, transparent 50%);
        }
        .app-container { max-width: 680px; margin:0 auto; padding:16px 18px 40px; }
        .header { text-align:center; padding:20px 0 10px; position:relative; }
        .bottle-wrapper { position:relative; display:inline-block; cursor:pointer; user-select:none; transition:transform var(--transition); }
        .bottle-wrapper:hover { transform:translateY(-3px); }
        .bottle-svg { width:100px; height:140px; filter:drop-shadow(0 8px 20px rgba(140,100,80,0.18)); }
        .sparkles { position:absolute; top:28px; left:50%; transform:translateX(-50%); width:36px; height:55px; pointer-events:none; }
        .sparkle { position:absolute; width:3px; height:3px; border-radius:50%; background:#e8c8a0; animation:sparkleFloat 3s ease-in-out infinite; }
        .sparkle:nth-child(1){ left:8px; top:10px; animation-delay:0s; width:2.5px; height:2.5px; }
        .sparkle:nth-child(2){ left:20px; top:6px; animation-delay:0.7s; width:2px; height:2px; }
        .sparkle:nth-child(3){ left:12px; top:22px; animation-delay:1.4s; width:3px; height:3px; background:#f0d4b0; }
        .sparkle:nth-child(4){ left:22px; top:18px; animation-delay:2.1s; width:2px; height:2px; background:#eed8b8; }
        .sparkle:nth-child(5){ left:15px; top:32px; animation-delay:0.5s; width:2.5px; height:2.5px; }
        .sparkle:nth-child(6){ left:6px; top:16px; animation-delay:1.8s; width:1.5px; height:1.5px; background:#f5e0c0; }
        @keyframes sparkleFloat { 0%,100%{ opacity:0.25; transform:translateY(0); } 30%{ opacity:0.9; transform:translateY(-8px); } 60%{ opacity:0.35; transform:translateY(-3px); } }
        .header-title { font-size:22px; font-weight:500; letter-spacing:1.5px; color:#4a3c3c; margin-top:6px; }
        .header-subtitle { font-size:13px; color:var(--text-muted); letter-spacing:0.8px; margin-top:2px; font-weight:300; }

        .user-switch { display:flex; justify-content:center; gap:8px; margin:18px 0 14px; background:var(--card-bg); border-radius:30px; padding:5px; box-shadow:var(--shadow-sm); border:1px solid var(--glass); }
        .user-switch-btn { flex:1; max-width:140px; padding:10px 18px; border:none; border-radius:26px; cursor:pointer; font-size:14px; letter-spacing:0.6px; background:transparent; color:var(--text-light); transition:all var(--transition); }
        .user-switch-btn.active { background:#fff; color:#3d3030; font-weight:500; box-shadow:var(--shadow-sm); }
        .user-badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px; margin-left:3px; }
        .badge-me { background:#f5e0d8; color:#b87060; }
        .badge-partner { background:#dde5f0; color:#5a7a9a; }

        .category-tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 8px; justify-content:center; }
        .cat-tab { padding:7px 12px; border-radius:20px; border:1px solid #e5ddd5; background:var(--card-bg); cursor:pointer; font-size:12px; color:var(--text-light); transition:all var(--transition); }
        .cat-tab.active { background:#fff; border-color:var(--accent-soft); color:#4a3030; font-weight:500; }
        .filter-tabs { display:flex; gap:6px; justify-content:center; margin-bottom:12px; }
        .filter-tab { padding:6px 14px; border-radius:20px; border:1px solid #e5ddd5; background:var(--card-bg); cursor:pointer; font-size:12px; color:var(--text-light); }
        .filter-tab.active { background:#f5e6e6; border-color:#d4857b; color:#b8554a; }
        .stats-bar { text-align:center; font-size:12px; color:var(--text-muted); margin-bottom:8px; }

        .cards-list { display:flex; flex-direction:column; gap:10px; }
        .kink-card { background:var(--card-bg); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm); border:1px solid transparent; transition:all var(--transition); animation:cardFadeIn 0.4s ease; }
        @keyframes cardFadeIn { from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
        .kink-card.matched-highlight { border-color:#c9d8c0; background:#fafff7; }
        .card-title { font-size:15px; font-weight:500; display:flex; align-items:center; gap:6px; }
        .card-desc { font-size:12.5px; color:var(--text-muted); margin-top:4px; }
        .interest-selector { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
        .interest-btn { padding:7px 13px; border-radius:18px; border:1.5px solid #e5ddd5; background:#fefdfa; cursor:pointer; font-size:12px; color:var(--text-light); transition:all var(--transition); }
        .interest-btn.selected { font-weight:500; }
        .interest-btn.level-love.selected { background:#fdf0ed; border-color:#d4857b; color:#b8554a; }
        .interest-btn.level-interest.selected { background:#fdf6f0; border-color:#d4a080; color:#b87850; }
        .interest-btn.level-curious.selected { background:#fdfaf4; border-color:#c9b896; color:#9a8058; }
        .interest-btn.level-meh.selected { background:#f9f8f6; border-color:#bfb5aa; color:#8a7d72; }
        .interest-btn.level-no.selected { background:#f8f7f6; border-color:#d0cbc6; color:#9a9088; }

        .bottom-actions { display:flex; gap:8px; margin-top:22px; justify-content:center; flex-wrap:wrap; }
        .action-btn { padding:10px 18px; border-radius:28px; border:1.5px solid #e0d8cc; background:var(--card-bg); cursor:pointer; font-size:13px; color:var(--text); transition:all var(--transition); box-shadow:var(--shadow-sm); }
        .action-btn:hover { box-shadow:var(--shadow-md); border-color:#c8b8a5; }
        .action-btn.primary { background:#fff; border-color:var(--accent-soft); color:#5a3a35; font-weight:500; }

        .floating-help-btn { position:fixed; bottom:24px; right:24px; width:52px; height:52px; border-radius:50%; background:#fffdf9; border:1.5px solid #d4c0b0; box-shadow:0 4px 16px rgba(100,70,50,0.2); cursor:pointer; font-size:24px; display:flex; align-items:center; justify-content:center; z-index:90; }

        .modal-overlay { position:fixed; inset:0; background:rgba(40,30,25,0.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn 0.3s; }
        @keyframes fadeIn { from{ opacity:0; } to{ opacity:1; } }
        .modal { background:#fffdf9; border-radius:var(--radius-lg); padding:28px 22px; max-width:500px; width:100%; max-height:80vh; overflow-y:auto; box-shadow:var(--shadow-lg); position:relative; }
        .modal-close { position:absolute; top:14px; right:16px; width:36px; height:36px; border-radius:50%; border:none; background:#f5f0ea; cursor:pointer; font-size:18px; }
        .modal h3 { text-align:center; margin-bottom:12px; }

        .radar-user-toggle { display:flex; justify-content:center; gap:8px; margin-bottom:12px; }
        .radar-user-toggle button { padding:6px 16px; border-radius:20px; border:1px solid #d4c0b0; background:#fff; cursor:pointer; }
        .radar-user-toggle button.active { background:#f5e8e0; color:#b85a5a; font-weight:500; }
        canvas { display:block; margin:0 auto; max-width:100%; }
        .detail-list { max-height:200px; overflow-y:auto; margin-top:12px; font-size:13px; }
        .detail-list .item { padding:6px 0; border-bottom:1px solid #f0e8e0; }
        .tag-like { background:#fdf0ed; color:#b8554a; padding:2px 8px; border-radius:10px; margin-left:6px; font-size:10px; }
        .tag-avoid { background:#f0f0f0; color:#8a7d72; padding:2px 8px; border-radius:10px; margin-left:6px; font-size:10px; }

        .match-item { padding:12px 14px; border-radius:10px; margin-bottom:8px; background:#fffefb; border:1px solid #e8e0d5; }
        .match-item.both-love { border-color:#c9d8c0; background:#f9fcf6; }
        .match-item.both-avoid { border-color:#e0c8c8; background:#fdf6f6; }
        .match-badge { display:inline-block; font-size:10px; padding:3px 8px; border-radius:10px; margin-left:6px; }
        .match-badge.perfect { background:#e8f0dc; color:#6a8a4a; }
        .match-badge.avoid { background:#f5e0e0; color:#b85a5a; }

        .random-card-popup { background:#fffdf9; border-radius:var(--radius-lg); padding:28px 22px; box-shadow:var(--shadow-lg); text-align:center; border:2px solid #f0e8d8; max-width:400px; width:90%; }
        .random-mode-select { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-direction:column; }
        .random-mode-select button { width:100%; }

        .glossary-table { width:100%; border-collapse:collapse; font-size:13px; }
        .glossary-table td { padding:8px 6px; border-bottom:1px solid #e8ddd2; }
        .glossary-table td:first-child { font-weight:500; color:#5a3a35; width:25%; }

        @media (max-width:480px) {
            .app-container { padding:10px 10px 30px; }
            .header-title { font-size:19px; }
            .bottle-svg { width:80px; height:115px; }
            .sparkles { top:22px; width:28px; height:44px; }
            .kink-card { padding:14px; }
            .interest-btn { padding:6px 10px; font-size:11px; }
        }
    </style>
</head>

        if(userChoices[currentUser][id] === level) delete userChoices[currentUser][id];
        else userChoices[currentUser][id] = level;
        saveChoices(); updateMarkedCount(); renderCards();
    }
    function getChoiceLabel(l) { return {love:"喜欢",interest:"兴趣",curious:"好奇",meh:"不想",no:"拒绝"}[l]||""; }
    function getFilteredData() {
        let data = kinkData;
        if (currentCategory !== "all") data = data.filter(i=>i.cat===currentCategory);
        const choices = userChoices[currentUser];
        if (currentFilter === "love-interest") data = data.filter(i=> choices[i.id]==="love"||choices[i.id]==="interest");
        else if (currentFilter === "curious") data = data.filter(i=> choices[i.id]==="curious");
        else if (currentFilter === "meh-no") data = data.filter(i=> choices[i.id]==="meh"||choices[i.id]==="no");
        else if (currentFilter === "none") data = data.filter(i=> !choices[i.id]);
        return data;
    }
    function renderCards() {
        const data = getFilteredData();
        let html = "";
        data.forEach((item,idx)=>{
            const choice = userChoices[currentUser][item.id];
            html += `<div class="kink-card">
                <div class="card-title">${item.emoji||""} ${item.name}</div>
                <div class="card-desc">${item.desc}</div>
                <div class="interest-selector">
                    <button class="interest-btn level-love ${choice==="love"?"selected":""}" onclick="window.setKinkChoice('${item.id}','love')">喜欢</button>
                    <button class="interest-btn level-interest ${choice==="interest"?"selected":""}" onclick="window.setKinkChoice('${item.id}','interest')">兴趣</button>
                    <button class="interest-btn level-curious ${choice==="curious"?"selected":""}" onclick="window.setKinkChoice('${item.id}','curious')">好奇</button>
                    <button class="interest-btn level-meh ${choice==="meh"?"selected":""}" onclick="window.setKinkChoice('${item.id}','meh')">不想</button>
                    <button class="interest-btn level-no ${choice==="no"?"selected":""}" onclick="window.setKinkChoice('${item.id}','no')">拒绝</button>
                </div>
            </div>`;
        });
        document.getElementById("cardsList").innerHTML = html || '<div style="text-align:center;padding:20px;">📭 无匹配项</div>';
    }
    function updateMarkedCount() {
        document.getElementById("markedCount").textContent = Object.keys(userChoices[currentUser]).length;
    }
    function refreshAll() {
        document.getElementById("btnUserA").classList.toggle("active", currentUser==="A");
        document.getElementById("btnUserB").classList.toggle("active", currentUser==="B");
        document.querySelectorAll(".cat-tab").forEach(t=>t.classList.toggle("active", t.dataset.cat===currentCategory));
        document.querySelectorAll(".filter-tab").forEach(t=>t.classList.toggle("active", t.dataset.filter===currentFilter));
        updateMarkedCount(); renderCards();
    }
    window.setKinkChoice = (id, level) => { setChoice(id, level); };

    // 匹配结果（含避雷）
    function showMatchModal() {
        const bothLove=[], bothInterest=[], oneLove=[], bothAvoid=[];
        kinkData.forEach(item=>{
            const a=userChoices.A[item.id], b=userChoices.B[item.id];
            if(!a||!b) return;
            if(a==="love"&&b==="love") bothLove.push(item);
            else if((a==="interest"||a==="love")&&(b==="interest"||b==="love")) bothInterest.push(item);
            else if((a==="love"&&b==="interest")||(a==="interest"&&b==="love")) oneLove.push(item);
            if((a==="meh"||a==="no")&&(b==="meh"||b==="no")) bothAvoid.push(item);
        });
        let html="";
        if(bothLove.length) { html+="<h4>🌟 双方非常喜欢</h4>"; bothLove.forEach(i=>html+=`<div class="match-item both-love">${i.emoji} ${i.name} <span class="match-badge perfect">完美</span></div>`); }
        if(bothInterest.length) { html+="<h4>🌿 双方感兴趣</h4>"; bothInterest.forEach(i=>html+=`<div class="match-item both-love">${i.emoji} ${i.name}</div>`); }
        if(oneLove.length) { html+="<h4>🔥 一方喜欢一方兴趣</h4>"; oneLove.forEach(i=>html+=`<div class="match-item both-love">${i.emoji} ${i.name}</div>`); }
        if(bothAvoid.length) { html+="<h4>🛑 双方都避雷</h4>"; bothAvoid.forEach(i=>html+=`<div class="match-item both-avoid">${i.emoji} ${i.name} <span class="match-badge avoid">避雷</span></div>`); }
        document.getElementById("matchResults").innerHTML = html || "暂无足够标记";
        document.getElementById("matchModal").style.display="flex";
    }

    // 雷达图
    const categories = ["foreplay","position","roleplay","sensory","location","toys","edge","niche","aftercare","body"];
    const catNames = { foreplay:"前戏", position:"体位", roleplay:"角色", sensory:"感官", location:"场所", toys:"玩具", edge:"克制", niche:"小众", aftercare:"事后", body:"身体" };
    let radarUser = "A";
    function drawRadar() {
        const canvas = document.getElementById("radarCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const center = { x:200, y:200 }, radius = 130;
        // 网格
        ctx.strokeStyle = "#e0d8cc"; ctx.lineWidth = 0.5;
        for(let i=1;i<=5;i++) {
            ctx.beginPath();
            const r = radius * i/5;
            for(let j=0;j<categories.length;j++) {
                const angle = (Math.PI*2/categories.length)*j - Math.PI/2;
                const x = center.x + r*Math.cos(angle), y = center.y + r*Math.sin(angle);
                j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
            }
            ctx.closePath(); ctx.stroke();
        }
        // 轴线
        ctx.strokeStyle = "#ccc";
        for(let j=0;j<categories.length;j++) {
            const angle = (Math.PI*2/categories.length)*j - Math.PI/2;
            ctx.beginPath(); ctx.moveTo(center.x, center.y);
            ctx.lineTo(center.x+radius*Math.cos(angle), center.y+radius*Math.sin(angle));
            ctx.stroke();
        }
        // 标签
        ctx.fillStyle = "#4a3c3c"; ctx.font = "12px 'PingFang SC'";
        categories.forEach((cat,j)=>{
            const angle = (Math.PI*2/categories.length)*j - Math.PI/2;
            const x = center.x + (radius+20)*Math.cos(angle);
            const y = center.y + (radius+20)*Math.sin(angle);
            ctx.fillText(catNames[cat], x-12, y+4);
        });

        function getValues(user, type) {
            return categories.map(cat => {
                const items = kinkData.filter(i=>i.cat===cat);
                const choices = userChoices[user];
                let count = 0;
                items.forEach(item => {
                    const val = choices[item.id];
                    if(type==="like" && (val==="love"||val==="interest")) count++;
                    if(type==="avoid" && (val==="meh"||val==="no")) count++;
                });
                return items.length ? Math.round(count/items.length*100) : 0;
            });
        }

        function drawPolygon(values, color, fillColor) {
            ctx.beginPath();
            ctx.strokeStyle = color; ctx.fillStyle = fillColor; ctx.lineWidth = 2;
            for(let j=0;j<categories.length;j++) {
                const angle = (Math.PI*2/categories.length)*j - Math.PI/2;
                const r = radius * (values[j]/100);
                const x = center.x + r*Math.cos(angle), y = center.y + r*Math.sin(angle);
                j===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
            }
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }

        if (radarUser === "compare") {
            drawPolygon(getValues("A","like"), "#d4857b", "rgba(212,133,123,0.15)");
            drawPolygon(getValues("B","like"), "#5a7a9a", "rgba(90,122,154,0.15)");
            drawPolygon(getValues("A","avoid"), "#c9b896", "rgba(201,184,150,0.1)");
            drawPolygon(getValues("B","avoid"), "#7a8a9a", "rgba(122,138,154,0.1)");
        } else {
            drawPolygon(getValues(radarUser,"like"), "#d4857b", "rgba(212,133,123,0.15)");
            drawPolygon(getValues(radarUser,"avoid"), "#9a8c8c", "rgba(150,130,130,0.1)");
        }
    }

    function showRadarDetail(cat) {
        const choices = userChoices[radarUser==="compare"? "A" : radarUser];
        const items = kinkData.filter(i=>i.cat===cat);
        let html = `<h4>${catNames[cat]} 明细</h4>`;
        const likes = items.filter(i=> choices[i.id]==="love"||choices[i.id]==="interest");
        const avoids = items.filter(i=> choices[i.id]==="meh"||choices[i.id]==="no");
        if(likes.length) {
            html += "<p style=\"color:#b8554a;\">❤️ 喜欢/兴趣：</p>";
            likes.forEach(i=> html += `<div class="item">${i.emoji} ${i.name} <span class="tag-like">${getChoiceLabel(choices[i.id])}</span></div>`);
        }
        if(avoids.length) {
            html += "<p style=\"color:#8a7d72;\">🛑 不想/拒绝：</p>";
            avoids.forEach(i=> html += `<div class="item">${i.emoji} ${i.name} <span class="tag-avoid">${getChoiceLabel(choices[i.id])}</span></div>`);
        }
        if(!likes.length&&!avoids.length) html += "<p>暂无标记</p>";
        document.getElementById("radarDetail").innerHTML = html;
    }

    // 随机
    function showRandomResult(item) {
        const c = userChoices[currentUser][item.id];
        const label = c ? ` (你已标记：${getChoiceLabel(c)})` : "";
        document.getElementById("randomCardContent").innerHTML = `
            <div style="font-size:48px;">${item.emoji||"🎭"}</div>
            <h3>${item.name}</h3>
            <p style="color:var(--text-muted);">${item.desc}${label}</p>
            <button class="action-btn" onclick="document.getElementById('randomResultModal').style.display='none'">知道了</button>`;
        document.getElementById("randomResultModal").style.display = "flex";
    }
    function randomCard(weighted = false) {
        const data = getFilteredData();
        if (!data.length) return;
        if (!weighted) {
            showRandomResult(data[Math.floor(Math.random()*data.length)]);
            return;
        }
        const scores = data.map(item => {
            const a = userChoices.A[item.id] || "", b = userChoices.B[item.id] || "";
            if (a==="love" && b==="love") return 10;
            if ((a==="love" && b==="interest") || (a==="interest" && b==="love")) return 7;
            if (a==="love" || b==="love") return 5;
            if (a==="interest" || b==="interest") return 3;
            return 1;
        });
        const total = scores.reduce((s,v)=>s+v, 0);
        let rand = Math.random() * total;
        for (let i=0; i<data.length; i++) {
            rand -= scores[i];
            if (rand <= 0) { showRandomResult(data[i]); return; }
        }
        showRandomResult(data[data.length-1]);
    }

    // 事件绑定
    document.getElementById("btnUserA").addEventListener("click", ()=>{ currentUser="A"; refreshAll(); });
    document.getElementById("btnUserB").addEventListener("click", ()=>{ currentUser="B"; refreshAll(); });
    document.getElementById("categoryTabs").addEventListener("click", e=>{
        const tab = e.target.closest(".cat-tab");
        if(!tab) return;
        currentCategory = tab.dataset.cat;
        refreshAll();
    });
    document.getElementById("filterTabs").addEventListener("click", e=>{
        const tab = e.target.closest(".filter-tab");
        if(!tab) return;
        currentFilter = tab.dataset.filter;
        refreshAll();
    });
    document.getElementById("btnMatch").addEventListener("click", showMatchModal);
    document.getElementById("matchModalClose").addEventListener("click", ()=>document.getElementById("matchModal").style.display="none");
    document.getElementById("matchModal").addEventListener("click", function(e){ if(e.target===this) this.style.display="none"; });

    document.getElementById("btnRadar").addEventListener("click", ()=>{
        radarUser = currentUser;
        document.getElementById("radarModal").style.display = "flex";
        updateRadarUserToggle();
        drawRadar();
        document.getElementById("radarDetail").innerHTML = "<p style=\"text-align:center;color:var(--text-muted);\">点击雷达轴查看明细</p>";
    });
    document.getElementById("radarModalClose").addEventListener("click", ()=>document.getElementById("radarModal").style.display="none");
    document.getElementById("radarModal").addEventListener("click", function(e){ if(e.target===this) this.style.display="none"; });
    document.getElementById("radarUserToggle").addEventListener("click", e=>{
        const btn = e.target.closest("button");
        if(!btn) return;
        radarUser = btn.dataset.radarUser;
        updateRadarUserToggle();
        drawRadar();
        document.getElementById("radarDetail").innerHTML = "<p style=\"text-align:center;color:var(--text-muted);\">点击雷达轴查看明细</p>";
    });
    function updateRadarUserToggle() {
        document.querySelectorAll("#radarUserToggle button").forEach(b=> b.classList.toggle("active", b.dataset.radarUser===radarUser));
    }
    document.getElementById("radarCanvas").addEventListener("click", function(e){
        const canvas = document.getElementById("radarCanvas");
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
        const mx = (e.clientX - rect.left)*scaleX, my = (e.clientY - rect.top)*scaleY;
        const center = { x:200, y:200 }, radius = 130;
        const dist = Math.hypot(mx-center.x, my-center.y);
        if(dist > radius+30 || dist < 10) return;
        let angle = Math.atan2(my-center.y, mx-center.x) + Math.PI/2;
        if(angle < 0) angle += Math.PI*2;
        const index = Math.round(angle / (Math.PI*2/categories.length)) % categories.length;
        showRadarDetail(categories[index]);
    });

    document.getElementById("btnRandom").addEventListener("click", ()=> document.getElementById("randomModeModal").style.display = "flex");
    document.getElementById("randomPure").addEventListener("click", ()=>{ document.getElementById("randomModeModal").style.display = "none"; randomCard(false); });
    document.getElementById("randomWeighted").addEventListener("click", ()=>{ document.getElementById("randomModeModal").style.display = "none"; randomCard(true); });
    document.getElementById("randomCancel").addEventListener("click", ()=> document.getElementById("randomModeModal").style.display="none");
    document.getElementById("bottleTrigger").addEventListener("click", ()=> randomCard(true));
    document.getElementById("randomResultModal").addEventListener("click", function(e){ if(e.target===this) this.style.display="none"; });

    document.getElementById("btnExport").addEventListener("click", ()=>{
        const data = userChoices[currentUser];
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `kink-bottle-user${currentUser}.json`;
        a.click(); URL.revokeObjectURL(a.href);
    });
    document.getElementById("btnImport").addEventListener("click", ()=> document.getElementById("importModal").style.display = "flex");
    document.getElementById("importModalClose").addEventListener("click", ()=> document.getElementById("importModal").style.display="none");
    document.getElementById("btnUploadFile").addEventListener("click", ()=> document.getElementById("importFileInput").click());
    document.getElementById("importFileInput").addEventListener("change", (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => { document.getElementById("importTextarea").value = ev.target.result; };
        reader.readAsText(file);
    });
    document.getElementById("btnConfirmImport").addEventListener("click", ()=>{
        const raw = document.getElementById("importTextarea").value.trim();
        if(!raw) return;
        let parsed;
        try { parsed = JSON.parse(raw); } catch(e) { return; }
        const target = document.querySelector("input[name=\"importTarget\"]:checked").value;
        const targetChoices = userChoices[target];
        for(const [key,val] of Object.entries(parsed)) {
            if(kinkData.some(k=>k.id===key) && ["love","interest","curious","meh","no"].includes(val)) {
                targetChoices[key] = val;
            }
        }
        saveChoices(); refreshAll(); document.getElementById("importModal").style.display = "none";
    });
    document.getElementById("btnReset").addEventListener("click", ()=>{
        if(confirm("重置当前视角的所有标记？")) { userChoices[currentUser] = {}; saveChoices(); refreshAll(); }
    });
    document.getElementById("btnGlossary").addEventListener("click", ()=> document.getElementById("glossaryModal").style.display = "flex");
    document.getElementById("glossaryModalClose").addEventListener("click", ()=> document.getElementById("glossaryModal").style.display="none");
    document.getElementById("floatingHelpBtn").addEventListener("click", ()=> document.getElementById("glossaryModal").style.display = "flex");
    document.getElementById("glossaryModal").addEventListener("click", function(e){ if(e.target===this) this.style.display="none"; });

    // 欢迎弹窗
    if (!localStorage.getItem(WELCOME_KEY)) {
        document.getElementById("welcomeModal").style.display = "flex";
        localStorage.setItem(WELCOME_KEY, "1");
    }
    document.getElementById("welcomeModalOk").addEventListener("click", ()=> document.getElementById("welcomeModal").style.display="none");
    document.getElementById("welcomeModalClose").addEventListener("click", ()=> document.getElementById("welcomeModal").style.display="none");

    loadChoices(); refreshAll();
})();
</script>
</body>
</html>
