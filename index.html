<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性癖之瓶 - 情侣探索</title>
    <style>
        :root {
            --bg: #faf7f2;
            --card-bg: #fffdf9;
            --text: #3d3535;
            --text-light: #6b5e5e;
            --text-muted: #9a8c8c;
            --accent: #c97d7d;
            --accent-soft: #e8c4c4;
            --shadow-sm: 0 2px 8px rgba(60,40,30,0.06);
            --shadow-md: 0 4px 16px rgba(60,40,30,0.1);
            --shadow-lg: 0 8px 32px rgba(60,40,30,0.14);
            --radius: 16px;
            --transition: 0.3s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.6; background-image:radial-gradient(ellipse at 50% 0%, rgba(210,170,150,0.12), transparent 60%); }
        .app-container { max-width:680px; margin:0 auto; padding:16px 18px 40px; }
        .header { text-align:center; padding:20px 0 10px; }
        .bottle-wrapper { display:inline-block; cursor:pointer; transition:transform var(--transition); }
        .bottle-wrapper:hover { transform:translateY(-3px); }
        .bottle-svg { width:100px; height:140px; filter:drop-shadow(0 8px 20px rgba(140,100,80,0.18)); }
        .sparkles { position:absolute; top:28px; left:50%; transform:translateX(-50%); width:36px; height:55px; pointer-events:none; }
        .sparkle { position:absolute; width:3px; height:3px; border-radius:50%; background:#e8c8a0; animation:sparkleFloat 3s infinite; }
        @keyframes sparkleFloat { 0%,100%{opacity:0.25;transform:translateY(0)} 30%{opacity:0.9;transform:translateY(-8px)} 60%{opacity:0.35;transform:translateY(-3px)} }
        .header-title { font-size:22px; font-weight:500; letter-spacing:1.5px; color:#4a3c3c; margin-top:6px; }
        .user-switch { display:flex; justify-content:center; gap:8px; margin:18px 0 14px; background:var(--card-bg); border-radius:30px; padding:5px; box-shadow:var(--shadow-sm); }
        .user-switch-btn { flex:1; max-width:140px; padding:10px 18px; border:none; border-radius:26px; cursor:pointer; font-size:14px; background:transparent; color:var(--text-light); transition:all var(--transition); }
        .user-switch-btn.active { background:#fff; color:#3d3030; font-weight:500; box-shadow:var(--shadow-sm); }
        .category-tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 8px; justify-content:center; }
        .cat-tab { padding:7px 12px; border-radius:20px; border:1px solid #e5ddd5; background:var(--card-bg); cursor:pointer; font-size:12px; color:var(--text-light); transition:all var(--transition); }
        .cat-tab.active { background:#fff; border-color:var(--accent-soft); color:#4a3030; font-weight:500; }
        .filter-tabs { display:flex; gap:6px; justify-content:center; margin-bottom:12px; }
        .filter-tab { padding:6px 14px; border-radius:20px; border:1px solid #e5ddd5; background:var(--card-bg); cursor:pointer; font-size:12px; color:var(--text-light); }
        .filter-tab.active { background:#f5e6e6; border-color:#d4857b; color:#b8554a; }
        .cards-list { display:flex; flex-direction:column; gap:10px; }
        .kink-card { background:var(--card-bg); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm); border:1px solid transparent; animation:cardFadeIn 0.4s ease; }
        @keyframes cardFadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .kink-card.matched-highlight { border-color:#c9d8c0; background:#fafff7; }
        .card-title { font-size:15px; font-weight:500; }
        .card-desc { font-size:12.5px; color:var(--text-muted); margin-top:4px; }
        .interest-selector { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
        .interest-btn { padding:7px 13px; border-radius:18px; border:1.5px solid #e5ddd5; background:#fefdfa; cursor:pointer; font-size:12px; color:var(--text-light); }
        .interest-btn.selected { font-weight:500; }
        .interest-btn.level-love.selected { background:#fdf0ed; border-color:#d4857b; color:#b8554a; }
        .interest-btn.level-interest.selected { background:#fdf6f0; border-color:#d4a080; color:#b87850; }
        .interest-btn.level-curious.selected { background:#fdfaf4; border-color:#c9b896; color:#9a8058; }
        .interest-btn.level-meh.selected { background:#f9f8f6; border-color:#bfb5aa; color:#8a7d72; }
        .interest-btn.level-no.selected { background:#f8f7f6; border-color:#d0cbc6; color:#9a9088; }
        .bottom-actions { display:flex; gap:8px; margin-top:22px; justify-content:center; flex-wrap:wrap; }
        .action-btn { padding:10px 18px; border-radius:28px; border:1.5px solid #e0d8cc; background:var(--card-bg); cursor:pointer; font-size:13px; color:var(--text); box-shadow:var(--shadow-sm); }
        .action-btn.primary { background:#fff; border-color:var(--accent-soft); color:#5a3a35; }
        .modal-overlay { position:fixed; inset:0; background:rgba(40,30,25,0.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn 0.3s; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .modal { background:#fffdf9; border-radius:var(--radius); padding:28px 22px; max-width:500px; width:100%; max-height:80vh; overflow-y:auto; box-shadow:var(--shadow-lg); position:relative; }
        .modal-close { position:absolute; top:14px; right:16px; width:36px; height:36px; border-radius:50%; border:none; background:#f5f0ea; cursor:pointer; font-size:18px; }
        .random-card-popup { background:#fffdf9; border-radius:var(--radius); padding:28px 22px; box-shadow:var(--shadow-lg); text-align:center; border:2px solid #f0e8d8; }
        .random-mode-select { display:flex; gap:8px; justify-content:center; margin-top:12px; }
        .radar-user-toggle { display:flex; justify-content:center; gap:8px; margin-bottom:12px; }
        .radar-user-toggle button { padding:6px 16px; border-radius:20px; border:1px solid #d4c0b0; background:#fff; cursor:pointer; }
        .radar-user-toggle button.active { background:#f5e8e0; color:#b85a5a; }
        canvas { display:block; margin:0 auto; max-width:100%; }
        .detail-list { max-height:200px; overflow-y:auto; margin-top:12px; font-size:13px; }
        .match-item { padding:12px 14px; border-radius:10px; margin-bottom:8px; background:#fffefb; border:1px solid #e8e0d5; }
        .match-item.both-love { border-color:#c9d8c0; background:#f9fcf6; }
        .match-item.both-avoid { border-color:#e0c8c8; background:#fdf6f6; }
        .floating-help-btn { position:fixed; bottom:24px; right:24px; width:52px; height:52px; border-radius:50%; background:#fffdf9; border:1.5px solid #d4c0b0; box-shadow:0 4px 16px rgba(100,70,50,0.2); cursor:pointer; font-size:24px; display:flex; align-items:center; justify-content:center; z-index:90; }
        @media (max-width:480px) {
            .app-container { padding:10px 10px 30px; }
            .header-title { font-size:19px; }
            .bottle-svg { width:80px; height:115px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="bottle-wrapper" id="bottleTrigger">
            <svg class="bottle-svg" viewBox="0 0 100 140">
                <defs><linearGradient id="glassGrad"><stop offset="0%" stop-color="#fff" stop-opacity="0.7"/><stop offset="30%" stop-color="#fdfaf6" stop-opacity="0.55"/><stop offset="100%" stop-color="#ede4d8" stop-opacity="0.35"/></linearGradient></defs>
                <path d="M28 55 C28 52 32 48 36 48 L40 48 L40 30 C40 22 44 16 50 14 C56 16 60 22 60 30 L60 48 L64 48 C68 48 72 52 72 55 L72 105 C72 118 62 128 50 128 C38 128 28 118 28 105 Z" fill="url(#glassGrad)" stroke="rgba(180,160,145,0.35)" stroke-width="2"/>
                <rect x="40" y="14" width="20" height="18" rx="3" fill="url(#glassGrad)" stroke="rgba(180,160,145,0.3)"/>
                <rect x="37" y="8" width="26" height="8" rx="4" fill="rgba(250,245,238,0.6)" stroke="rgba(180,160,145,0.3)"/>
                <path d="M34 60 L38 100" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/>
                <ellipse cx="50" cy="9" rx="11" ry="5" fill="#e8d5c0"/>
            </svg>
        </div>
        <h1 class="header-title">性癖之瓶</h1>
    </div>

    <div class="user-switch">
        <button class="user-switch-btn active" id="btnUserA">💛 我</button>
        <button class="user-switch-btn" id="btnUserB">💙 伴侣</button>
    </div>

    <div class="category-tabs" id="categoryTabs">
        <button class="cat-tab active" data-cat="all">✨ 全部</button>
        <button class="cat-tab" data-cat="foreplay">🌙 前戏</button>
        <button class="cat-tab" data-cat="position">🔥 体位</button>
        <button class="cat-tab" data-cat="roleplay">🎭 角色</button>
        <button class="cat-tab" data-cat="sensory">🎪 感官</button>
        <button class="cat-tab" data-cat="location">📍 场所</button>
        <button class="cat-tab" data-cat="toys">🧸 玩具</button>
        <button class="cat-tab" data-cat="edge">💫 克制</button>
        <button class="cat-tab" data-cat="niche">🌈 小众</button>
        <button class="cat-tab" data-cat="aftercare">🫂 事后</button>
        <button class="cat-tab" data-cat="body">🫀 身体</button>
    </div>

    <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all">全部标记</button>
        <button class="filter-tab" data-filter="love-interest">❤️ 喜欢/兴趣</button>
        <button class="filter-tab" data-filter="curious">🤔 好奇</button>
        <button class="filter-tab" data-filter="meh-no">🛑 不想/拒绝</button>
        <button class="filter-tab" data-filter="none">❓ 未标记</button>
    </div>

    <div class="stats-bar"><span id="markedCount">0</span> 个偏好已标记</div>
    <div class="cards-list" id="cardsList"></div>

    <div class="bottom-actions">
        <button class="action-btn" id="btnRandom">🎲 随机</button>
        <button class="action-btn primary" id="btnMatch">💞 匹配</button>
        <button class="action-btn" id="btnRadar">💹 雷达</button>
        <button class="action-btn" id="btnReset">🔄 重置</button>
        <button class="action-btn" id="btnExport">📤 导出</button>
        <button class="action-btn" id="btnImport">📥 导入</button>
        <button class="action-btn" id="btnGlossary">📖 术语表</button>
    </div>
</div>

<button class="floating-help-btn" id="floatingHelpBtn">📖</button>

<!-- 匹配弹窗 -->
<div class="modal-overlay" id="matchModal" style="display:none;"><div class="modal"><button class="modal-close" id="matchModalClose">✕</button><h3>💞 匹配结果</h3><div id="matchResults"></div></div></div>

<!-- 雷达弹窗 -->
<div class="modal-overlay" id="radarModal" style="display:none;">
    <div class="modal" style="max-width:550px;">
        <button class="modal-close" id="radarModalClose">✕</button>
        <h3>💹 倾向雷达图</h3>
        <div class="radar-user-toggle" id="radarUserToggle">
            <button class="active" data-radar-user="A">💛 我</button>
            <button data-radar-user="B">💙 伴侣</button>
            <button data-radar-user="compare">💞 对比</button>
        </div>
        <canvas id="radarCanvas" width="400" height="400"></canvas>
        <div class="detail-list" id="radarDetail"><p>点击雷达轴查看明细</p></div>
    </div>
</div>

<!-- 随机模式选择弹窗 -->
<div class="modal-overlay" id="randomModeModal" style="display:none;">
    <div class="random-card-popup">
        <h3>🎲 选择随机模式</h3>
        <div class="random-mode-select">
            <button class="action-btn primary" id="randomPure">完全随机</button>
            <button class="action-btn primary" id="randomWeighted">⚖️ 加权随机（双人偏好）</button>
        </div>
        <button class="action-btn" style="margin-top:12px;" id="randomCancel">取消</button>
    </div>
</div>

<!-- 随机结果弹窗 -->
<div class="modal-overlay" id="randomResultModal" style="display:none;"><div class="random-card-popup" id="randomCardContent"></div></div>

<!-- 其他弹窗 -->
<div class="modal-overlay" id="welcomeModal" style="display:none;"><div class="modal"><button class="modal-close" id="welcomeModalClose">✕</button><p>欢迎！150项探索</p><button id="welcomeModalOk">开始</button></div></div>
<div class="modal-overlay" id="glossaryModal" style="display:none;"><div class="modal"><button class="modal-close" id="glossaryModalClose">✕</button><table class="glossary-table"><tr><td>RT</td><td>乳头</td></tr><tr><td>HD</td><td>高潮</td></tr></table></div></div>
<div class="modal-overlay" id="importModal" style="display:none;"><div class="modal"><button class="modal-close" id="importModalClose">✕</button><textarea id="importTextarea"></textarea><input type="file" id="importFileInput" accept=".json"><button id="btnUploadFile">选择文件</button><label><input type="radio" name="importTarget" value="A" checked> 我</label><label><input type="radio" name="importTarget" value="B"> 伴侣</label><button id="btnConfirmImport">导入</button></div></div>
<div id="toastContainer"></div>

<script>
(function() {
    const kinkData = [/* ... 保留全部150项数据，此处省略以节省篇幅，实际部署时需包含完整数组 ... */];
    // 请将之前对话中的150项完整数据粘贴在此处
    const STORAGE_KEY_A = "kink_bottle_userA", STORAGE_KEY_B = "kink_bottle_userB";
    let currentUser = "A", currentCategory = "all", currentFilter = "all";
    let userChoices = { A:{}, B:{} };

    function loadChoices() { /* 加载逻辑 */ }
    function saveChoices() { /* 保存逻辑 */ }
    function setChoice(id, level) { /* 设置选择 */ }
    function getChoiceLabel(l) { return {love:"喜欢",interest:"兴趣",curious:"好奇",meh:"不想",no:"拒绝"}[l]||""; }

    function getFilteredData() {
        let data = kinkData;
        if (currentCategory !== "all") data = data.filter(i=>i.cat===currentCategory);
        const choices = userChoices[currentUser];
        if (currentFilter === "love-interest") data = data.filter(i=> choices[i.id]==="love"||choices[i.id]==="interest");
        else if (currentFilter === "curious") data = data.filter(i=> choices[i.id]==="curious");
        else if (currentFilter === "meh-no") data = data.filter(i=> choices[i.id]==="meh"||choices[i.id]==="no");
        else if (currentFilter === "none") data = data.filter(i=> !choices[i.id]);
        return data;
    }

    function renderCards() {
        const data = getFilteredData();
        let html = "";
        data.forEach((item,idx)=>{
            const choice = userChoices[currentUser][item.id];
            html += `<div class="kink-card"><div class="card-title">${item.emoji||""} ${item.name}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="interest-selector">
                <button class="interest-btn level-love ${choice==='love'?'selected':''}" onclick="window.setKinkChoice('${item.id}','love')">喜欢</button>
                <button class="interest-btn level-interest ${choice==='interest'?'selected':''}" onclick="window.setKinkChoice('${item.id}','interest')">兴趣</button>
                <button class="interest-btn level-curious ${choice==='curious'?'selected':''}" onclick="window.setKinkChoice('${item.id}','curious')">好奇</button>
                <button class="interest-btn level-meh ${choice==='meh'?'selected':''}" onclick="window.setKinkChoice('${item.id}','meh')">不想</button>
                <button class="interest-btn level-no ${choice==='no'?'selected':''}" onclick="window.setKinkChoice('${item.id}','no')">拒绝</button>
            </div></div>`;
        });
        document.getElementById("cardsList").innerHTML = html || '<div style="text-align:center;padding:20px;">📭 无匹配项</div>';
    }

    // 随机（加权与完全随机）
    function showRandomResult(item) {
        const c = userChoices[currentUser][item.id];
        const label = c ? ` (你已标记：${getChoiceLabel(c)})` : "";
        document.getElementById("randomCardContent").innerHTML = `
            <div style="font-size:48px;">${item.emoji||"🎭"}</div>
            <h3>${item.name}</h3>
            <p style="color:var(--text-muted);">${item.desc}${label}</p>
            <button class="action-btn" onclick="document.getElementById('randomResultModal').style.display='none'">知道了</button>`;
        document.getElementById("randomResultModal").style.display = "flex";
    }

    function randomCard(weighted = false) {
        const data = getFilteredData();
        if (!data.length) return;
        if (!weighted) {
            showRandomResult(data[Math.floor(Math.random()*data.length)]);
            return;
        }
        // 加权计算双人匹配分
        const scores = data.map(item => {
            const a = userChoices.A[item.id] || "", b = userChoices.B[item.id] || "";
            if (a==="love" && b==="love") return 10;
            if ((a==="love" && b==="interest") || (a==="interest" && b==="love")) return 7;
            if (a==="love" || b==="love") return 5;
            if (a==="interest" || b==="interest") return 3;
            return 1;
        });
        const total = scores.reduce((s,v)=>s+v, 0);
        let rand = Math.random() * total;
        for (let i=0; i<data.length; i++) {
            rand -= scores[i];
            if (rand <= 0) { showRandomResult(data[i]); return; }
        }
        showRandomResult(data[data.length-1]);
    }

    document.getElementById("btnRandom").addEventListener("click", ()=>{
        document.getElementById("randomModeModal").style.display = "flex";
    });
    document.getElementById("randomPure").addEventListener("click", ()=>{
        document.getElementById("randomModeModal").style.display = "none";
        randomCard(false);
    });
    document.getElementById("randomWeighted").addEventListener("click", ()=>{
        document.getElementById("randomModeModal").style.display = "none";
        randomCard(true);
    });
    document.getElementById("randomCancel").addEventListener("click", ()=> document.getElementById("randomModeModal").style.display="none");
    document.getElementById("bottleTrigger").addEventListener("click", ()=> randomCard(true));
    document.getElementById("randomResultModal").addEventListener("click", function(e){ if(e.target===this) this.style.display="none"; });

    // 雷达图逻辑（支持对比）
    const categories = ["foreplay","position","roleplay","sensory","location","toys","edge","niche","aftercare","body"];
    const catNames = { foreplay:"前戏", position:"体位", roleplay:"角色", sensory:"感官", location:"场所", toys:"玩具", edge:"克制", niche:"小众", aftercare:"事后", body:"身体" };
    let radarUser = "A";
    function drawRadar() {
        const canvas = document.getElementById("radarCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const center = { x:200, y:200 }, radius = 140;
        // 绘制网格和标签略
        // 根据radarUser绘制多边形
        if (radarUser === "compare") {
            // 绘制两人对比
            drawUserPolygon("A", "#d4857b", "rgba(212,133,123,0.15)", true);
            drawUserPolygon("B", "#5a7a9a", "rgba(90,122,154,0.15)", false);
        } else {
            drawUserPolygon(radarUser, "#d4857b", "rgba(212,133,123,0.15)", true);
            drawUserPolygon(radarUser, "#9a8c8c", "rgba(150,130,130,0.1)", false);
        }
    }
    function drawUserPolygon(user, color, fill, isLike) { /* ... */ }
    // 省略具体画图实现，保留之前的雷达绘制代码

    // 其他事件绑定与初始化
    // ...
    loadChoices(); renderCards();
})();
</script>
</body>
</html>
