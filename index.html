<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性癖之瓶 - 情侣探索</title>
    <style>
        :root {
            --bg: #faf7f2;
            --card-bg: #fffdf9;
            --text: #3d3535;
            --text-light: #6b5e5e;
            --text-muted: #9a8c8c;
            --accent: #c97d7d;
            --accent-soft: #e8c4c4;
            --gold: #c9a87d;
            --glass: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(180, 160, 150, 0.25);
            --shadow-sm: 0 2px 8px rgba(60, 40, 30, 0.06);
            --shadow-md: 0 4px 16px rgba(60, 40, 30, 0.1);
            --shadow-lg: 0 8px 32px rgba(60, 40, 30, 0.14);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 24px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --level-love: #d4857b;
            --level-interest: #e0a882;
            --level-curious: #c9b896;
            --level-meh: #b5a9a0;
            --level-no: #c4bfbb;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(210,170,150,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 20%, rgba(200,160,140,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 15% 60%, rgba(190,150,130,0.06) 0%, transparent 50%);
        }
        .app-container { max-width: 680px; margin:0 auto; padding:16px 18px 40px; }
        .header { text-align:center; padding:20px 0 10px; position:relative; }
        .bottle-wrapper { position:relative; display:inline-block; cursor:pointer; user-select:none; transition:transform var(--transition); }
        .bottle-wrapper:hover { transform:translateY(-3px); }
        .bottle-wrapper:active { transform:scale(0.96); }
        .bottle-svg { width:100px; height:140px; filter:drop-shadow(0 8px 20px rgba(140,100,80,0.18)); transition:filter var(--transition); }
        .bottle-wrapper:hover .bottle-svg { filter:drop-shadow(0 12px 28px rgba(140,100,80,0.28)); }
        .sparkles { position:absolute; top:28px; left:50%; transform:translateX(-50%); width:36px; height:55px; pointer-events:none; }
        .sparkle { position:absolute; width:3px; height:3px; border-radius:50%; background:#e8c8a0; animation:sparkleFloat 3s ease-in-out infinite; }
        .sparkle:nth-child(1){ left:8px; top:10px; animation-delay:0s; width:2.5px; height:2.5px; }
        .sparkle:nth-child(2){ left:20px; top:6px; animation-delay:0.7s; width:2px; height:2px; }
        .sparkle:nth-child(3){ left:12px; top:22px; animation-delay:1.4s; width:3px; height:3px; background:#f0d4b0; }
        .sparkle:nth-child(4){ left:22px; top:18px; animation-delay:2.1s; width:2px; height:2px; background:#eed8b8; }
        .sparkle:nth-child(5){ left:15px; top:32px; animation-delay:0.5s; width:2.5px; height:2.5px; }
        .sparkle:nth-child(6){ left:6px; top:16px; animation-delay:1.8s; width:1.5px; height:1.5px; background:#f5e0c0; }
        @keyframes sparkleFloat {
            0%,100%{ opacity:0.25; transform:translateY(0); }
            30%{ opacity:0.9; transform:translateY(-8px); }
            60%{ opacity:0.35; transform:translateY(-3px); }
        }
        .bottle-hint { display:block; font-size:12px; color:var(--text-muted); margin-top:4px; letter-spacing:0.5px; animation:hintPulse 3s ease-in-out infinite; }
        @keyframes hintPulse { 0%,100%{ opacity:0.5; } 50%{ opacity:1; } }
        .header-title { font-size:22px; font-weight:500; letter-spacing:1.5px; color:#4a3c3c; margin-top:6px; }
        .header-subtitle { font-size:13px; color:var(--text-muted); letter-spacing:0.8px; margin-top:2px; font-weight:300; }

        .user-switch { display:flex; justify-content:center; gap:8px; margin:18px 0 14px; background:var(--card-bg); border-radius:30px; padding:5px; box-shadow:var(--shadow-sm); border:1px solid var(--glass-border); }
        .user-switch-btn { flex:1; max-width:140px; padding:10px 18px; border:none; border-radius:26px; cursor:pointer; font-size:14px; letter-spacing:0.6px; font-weight:400; transition:all var(--transition); background:transparent; color:var(--text-light); white-space:nowrap; }
        .user-switch-btn.active { background:#fff; color:#3d3030; font-weight:500; box-shadow:var(--shadow-sm); }
        .user-badge { display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px; margin-left:3px; vertical-align:middle; }
        .badge-me { background:#f5e0d8; color:#b87060; }
        .badge-partner { background:#dde5f0; color:#5a7a9a; }

        .category-tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 16px; justify-content:center; }
        .cat-tab { padding:7px 12px; border-radius:20px; border:1px solid #e5ddd5; background:var(--card-bg); cursor:pointer; font-size:12px; letter-spacing:0.4px; color:var(--text-light); transition:all var(--transition); white-space:nowrap; }
        .cat-tab:hover { border-color:#d5c8b8; background:#fffefb; }
        .cat-tab.active { background:#fff; border-color:var(--accent-soft); color:#4a3030; font-weight:500; box-shadow:var(--shadow-sm); }

        .stats-bar { display:flex; justify-content:space-between; align-items:center; padding:8px 14px; margin-bottom:10px; font-size:12px; color:var(--text-muted); }
        .stats-count span { color:var(--accent); font-weight:600; }

        .cards-list { display:flex; flex-direction:column; gap:10px; }
        .kink-card { background:var(--card-bg); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm); border:1px solid transparent; transition:all var(--transition); animation:cardFadeIn 0.4s ease forwards; }
        @keyframes cardFadeIn { from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
        .kink-card:hover { box-shadow:var(--shadow-md); border-color:#e8ddd2; }
        .kink-card.matched-highlight { border-color:#c9d8c0; background:#fafff7; box-shadow:0 2px 12px rgba(140,170,120,0.15); }
        .kink-card .card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
        .kink-card .card-title { font-size:15px; font-weight:500; color:#3d3030; flex:1; }
        .kink-card .card-desc { font-size:12.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
        .card-tag { display:inline-block; font-size:10px; padding:3px 8px; border-radius:10px; background:#f5efe8; color:#a09080; flex-shrink:0; }
        .card-tag.popular { background:#fef5ee; color:#c89070; }
        .card-tag.niche { background:#f3eff8; color:#8a7a9a; }
        .card-tag.gentle { background:#f5f8f0; color:#8a9a70; }

        .interest-selector { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
        .interest-btn { padding:7px 13px; border-radius:18px; border:1.5px solid #e5ddd5; background:#fefdfa; cursor:pointer; font-size:12px; letter-spacing:0.3px; color:var(--text-light); transition:all var(--transition); white-space:nowrap; }
        .interest-btn:hover { border-color:#d0c5b8; background:#fffefc; }
        .interest-btn.selected { font-weight:500; transform:scale(1.03); }
        .interest-btn.level-love.selected { background:#fdf0ed; border-color:#d4857b; color:#b8554a; }
        .interest-btn.level-interest.selected { background:#fdf6f0; border-color:#d4a080; color:#b87850; }
        .interest-btn.level-curious.selected { background:#fdfaf4; border-color:#c9b896; color:#9a8058; }
        .interest-btn.level-meh.selected { background:#f9f8f6; border-color:#bfb5aa; color:#8a7d72; }
        .interest-btn.level-no.selected { background:#f8f7f6; border-color:#d0cbc6; color:#9a9088; }
        .interest-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
        .dot-love { background:#d4857b; } .dot-interest { background:#d4a080; } .dot-curious { background:#c9b896; } .dot-meh { background:#b5a9a0; } .dot-no { background:#c4bfbb; }

        .bottom-actions { display:flex; gap:8px; margin-top:22px; justify-content:center; flex-wrap:wrap; }
        .action-btn { padding:10px 18px; border-radius:28px; border:1.5px solid #e0d8cc; background:var(--card-bg); cursor:pointer; font-size:13px; letter-spacing:0.5px; color:var(--text); transition:all var(--transition); box-shadow:var(--shadow-sm); white-space:nowrap; }
        .action-btn:hover { box-shadow:var(--shadow-md); border-color:#c8b8a5; }
        .action-btn.primary { background:#fff; border-color:var(--accent-soft); color:#5a3a35; font-weight:500; }
        .action-btn.primary:hover { background:#fffaf8; border-color:#d4a8a0; }

        .modal-overlay { position:fixed; inset:0; background:rgba(40,30,25,0.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn 0.3s ease; }
        @keyframes fadeIn { from{ opacity:0; } to{ opacity:1; } }
        .modal { background:#fffdf9; border-radius:var(--radius-lg); padding:28px 22px 22px; max-width:500px; width:100%; max-height:80vh; overflow-y:auto; box-shadow:var(--shadow-lg); position:relative; animation:modalSlideUp 0.35s ease; }
        @keyframes modalSlideUp { from{ transform:translateY(40px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
        .modal-close { position:absolute; top:14px; right:16px; width:36px; height:36px; border-radius:50%; border:none; background:#f5f0ea; cursor:pointer; font-size:18px; color:#8a7a6a; transition:all var(--transition); display:flex; align-items:center; justify-content:center; }
        .modal-close:hover { background:#ebe3d8; color:#5a4030; }
        .modal h3 { font-size:18px; font-weight:500; letter-spacing:0.8px; color:#3d3030; margin-bottom:8px; text-align:center; }
        .modal .modal-subtitle { text-align:center; font-size:13px; color:var(--text-muted); margin-bottom:18px; }
        .import-textarea { width:100%; height:120px; border:1.5px solid #e0d8cc; border-radius:var(--radius-sm); padding:12px; font-family:monospace; font-size:12px; resize:vertical; background:#fefdfa; }
        .import-actions { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
        .import-radio-group { margin:8px 0; display:flex; gap:12px; }
        .match-item { padding:12px 14px; border-radius:var(--radius-sm); margin-bottom:8px; border:1px solid #e8e0d5; background:#fffefb; }
        .match-item.both-love { border-color:#c9d8c0; background:#f9fcf6; border-left:3px solid #9ab87a; }
        .match-item.one-interested { border-color:#e8dcc8; background:#fefcf7; border-left:3px solid #d4b896; }
        .match-badge { display:inline-block; font-size:10px; padding:3px 8px; border-radius:10px; margin-left:6px; }
        .match-badge.perfect { background:#e8f0dc; color:#6a8a4a; }
        .match-badge.good { background:#fdf0e4; color:#b87850; }
        .random-card-popup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8); background:#fffdf9; border-radius:var(--radius-lg); padding:28px 22px; box-shadow:var(--shadow-lg); z-index:120; max-width:400px; width:90%; text-align:center; animation:popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; border:2px solid #f0e8d8; }
        @keyframes popIn { to{ transform:translate(-50%,-50%) scale(1); opacity:1; } }
        .random-card-popup .random-emoji { font-size:48px; display:block; margin-bottom:8px; }
        .random-card-popup .random-title { font-size:18px; font-weight:500; }
        .random-card-popup .random-desc { font-size:13px; color:var(--text-muted); margin:8px 0 16px; }
        .random-card-popup .random-close { padding:10px 24px; border-radius:20px; border:1.5px solid #e0d8cc; background:#fff; cursor:pointer; font-size:14px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#3d3530; color:#f5ede4; padding:10px 22px; border-radius:22px; font-size:13px; z-index:200; animation:toastUp 2s ease forwards; pointer-events:none; }
        @keyframes toastUp { 0%{ opacity:0; transform:translateX(-50%) translateY(20px); } 15%{ opacity:1; transform:translateX(-50%) translateY(0); } 75%{ opacity:1; } 100%{ opacity:0; transform:translateX(-50%) translateY(-15px); } }
        @media (max-width:480px) {
            .app-container { padding:10px 10px 30px; }
            .header-title { font-size:19px; }
            .bottle-svg { width:80px; height:115px; }
            .sparkles { top:22px; width:28px; height:44px; }
            .kink-card { padding:14px; }
            .interest-btn { padding:6px 10px; font-size:11px; }
        }
    </style>
</head>

</div>

<div class="modal-overlay" id="matchModal" style="display:none;">

    const STORAGE_KEY_A = "kink_bottle_userA", STORAGE_KEY_B = "kink_bottle_userB";
    let currentUser = "A", currentCategory = "all";
    let userChoices = { A:{}, B:{} };

    function loadChoices() {
        try {
            const a=localStorage.getItem(STORAGE_KEY_A), b=localStorage.getItem(STORAGE_KEY_B);
            if(a) userChoices.A=JSON.parse(a);
            if(b) userChoices.B=JSON.parse(b);
        } catch(e) { userChoices.A={}; userChoices.B={}; }
    }
    function saveChoices() {
        localStorage.setItem(STORAGE_KEY_A, JSON.stringify(userChoices.A));
        localStorage.setItem(STORAGE_KEY_B, JSON.stringify(userChoices.B));
    }
    function setChoice(id, level) {
        if(userChoices[currentUser][id] === level) delete userChoices[currentUser][id];
        else userChoices[currentUser][id] = level;
        saveChoices(); updateMarkedCount(); renderCards();
    }
    function getChoiceLabel(l) { return {love:"非常喜欢",interest:"有兴趣",curious:"好奇",meh:"不太想",no:"拒绝"}[l]||""; }
    function getFilteredData() { return currentCategory==="all" ? kinkData : kinkData.filter(i=>i.cat===currentCategory); }
    function checkMutualMatch(id) {
        const a=userChoices.A[id], b=userChoices.B[id];
        return a&&b&&["love","interest"].includes(a)&&["love","interest"].includes(b);
    }

    function renderCards() {
        const data = getFilteredData();
        let html = "";
        data.forEach((item,idx)=>{
            const choice = userChoices[currentUser][item.id];
            const tag = item.tag==="popular"?"热门":item.tag==="gentle"?"温柔":item.tag==="niche"?"小众":"";
            const matched = checkMutualMatch(item.id);
            html += `<div class="kink-card ${matched?"matched-highlight":""}" style="animation-delay:${idx*0.02}s">
                <div class="card-header"><span class="card-title">${item.emoji||""} ${item.name}</span>${tag?`<span class="card-tag ${item.tag}">${tag}</span>`:""}</div>
                <div class="card-desc">${item.desc}</div>
                <div class="interest-selector">
                    <button class="interest-btn level-love ${choice==="love"?"selected":""}" onclick="window.setKinkChoice('${item.id}','love')"><span class="interest-dot dot-love"></span>喜欢</button>
                    <button class="interest-btn level-interest ${choice==="interest"?"selected":""}" onclick="window.setKinkChoice('${item.id}','interest')"><span class="interest-dot dot-interest"></span>兴趣</button>
                    <button class="interest-btn level-curious ${choice==="curious"?"selected":""}" onclick="window.setKinkChoice('${item.id}','curious')"><span class="interest-dot dot-curious"></span>好奇</button>
                    <button class="interest-btn level-meh ${choice==="meh"?"selected":""}" onclick="window.setKinkChoice('${item.id}','meh')"><span class="interest-dot dot-meh"></span>不想</button>
                    <button class="interest-btn level-no ${choice==="no"?"selected":""}" onclick="window.setKinkChoice('${item.id}','no')"><span class="interest-dot dot-no"></span>拒绝</button>
                </div>
            </div>`;
        });
        document.getElementById("cardsList").innerHTML = html || '<div style="text-align:center;color:var(--text-muted);padding:20px;">📭 该分类暂无内容</div>';
    }

    function updateMarkedCount() {
        document.getElementById("markedCount").textContent = Object.keys(userChoices[currentUser]).length;
        const label = document.getElementById("currentUserLabel");
        if(currentUser==="A") { label.textContent="💛 当前：我的视角"; label.style.color="#b87060"; }
        else { label.textContent="💙 当前：伴侣的视角"; label.style.color="#5a7a9a"; }
    }
    function refreshAll() {
        document.getElementById("btnUserA").classList.toggle("active", currentUser==="A");

    }

        const data = userChoices[currentUser];
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `kink-bottle-user${currentUser}.json`;
        a.click(); URL.revokeObjectURL(a.href);
        showToast("📤 数据已导出");
    });

    const importModal = document.getElementById("importModal");
    document.getElementById("btnImport").addEventListener("click", ()=>{
        document.getElementById("importTextarea").value = "";
        document.getElementById("importFileInput").value = "";
        importModal.style.display = "flex";
    });
    document.getElementById("importModalClose").addEventListener("click", ()=>importModal.style.display="none");
    document.getElementById("btnCancelImport").addEventListener("click", ()=>importModal.style.display="none");
    document.getElementById("btnUploadFile").addEventListener("click", ()=>document.getElementById("importFileInput").click());
    document.getElementById("importFileInput").addEventListener("change", (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => { document.getElementById("importTextarea").value = ev.target.result; };
        reader.readAsText(file);
    });
    document.getElementById("btnConfirmImport").addEventListener("click", ()=>{
        const raw = document.getElementById("importTextarea").value.trim();
        if(!raw) { showToast("请粘贴或选择文件"); return; }
        let parsed;
        try { parsed = JSON.parse(raw); } catch(e) { showToast("JSON格式错误"); return; }
        if(typeof parsed !== "object" || Array.isArray(parsed)) { showToast("格式不正确"); return; }
        const target = document.querySelector("input[name=\"importTarget\"]:checked").value;
        const targetChoices = userChoices[target];
        let count = 0;
        for(const [key,val] of Object.entries(parsed)) {
            if(!kinkData.some(k=>k.id===key)) continue;
            if(["love","interest","curious","meh","no"].includes(val)) {
                targetChoices[key] = val; count++;
            }
        }
        if(count===0) { showToast("没有有效数据"); return; }
        saveChoices(); importModal.style.display="none"; refreshAll();
        showToast(`✅ 已导入 ${count} 条到「${target==="A"?"我":"伴侣"}」`);
    });

    document.getElementById("btnMatch").addEventListener("click", ()=>{
        const bothLove=[], bothInterest=[], oneLove=[], mixed=[];
        kinkData.forEach(item=>{
            const a=userChoices.A[item.id], b=userChoices.B[item.id];
            if(!a||!b) return;
            if(a==="love"&&b==="love") bothLove.push(item);
            else if((a==="interest"||a==="love")&&(b==="interest"||b==="love")) bothInterest.push(item);
            else if((a==="love"&&b==="interest")||(a==="interest"&&b==="love")) oneLove.push(item);
            else if(["love","interest"].includes(a)||["love","interest"].includes(b)) mixed.push({...item, a,b});
        });
        let html="";
        if(bothLove.length) { html+="<h4 style=\"color:#6a8a4a;\">🌟 双方都非常喜欢</h4>"; bothLove.forEach(i=>html+=`<div class="match-item both-love"><span class="match-name">${i.emoji} ${i.name}</span><span class="match-badge perfect">完美</span><div>${i.desc}</div></div>`); }
        if(bothInterest.length) { html+="<h4 style=\"color:#8a9a70;\">🌿 双方都感兴趣</h4>"; bothInterest.forEach(i=>html+=`<div class="match-item both-love"><span class="match-name">${i.emoji} ${i.name}</span><span class="match-badge perfect">可试</span><div>${i.desc}</div></div>`); }
        if(oneLove.length) { html+="<h4 style=\"color:#b87850;\">🔥 一方喜欢一方兴趣</h4>"; oneLove.forEach(i=>html+=`<div class="match-item one-interested"><span class="match-name">${i.emoji} ${i.name}</span><span class="match-badge good">沟通</span><div>${i.desc}</div></div>`); }
        if(mixed.length) { html+="<h4 style=\"color:#9a8a6a;\">💭 至少一方有兴趣</h4>"; mixed.forEach(i=>html+=`<div class="match-item one-interested"><span class="match-name">${i.emoji} ${i.name}</span><div>你：${getChoiceLabel(i.a)} | 伴侣：${getChoiceLabel(i.b)}</div></div>`); }
        document.getElementById("matchResults").innerHTML = html || "<div style=\"text-align:center;color:var(--text-muted);\">🤷 还没有足够的标记数据</div>";
        document.getElementById("matchModal").style.display="flex";
    });
    document.getElementById("matchModalClose").addEventListener("click", ()=>document.getElementById("matchModal").style.display="none");
    document.getElementById("matchModal").addEventListener("click", function(e){ if(e.target===this) this.style.display="none"; });

    document.getElementById("btnRandom").addEventListener("click", ()=>{
        const data = getFilteredData();
        if(!data.length) return showToast("无数据");
        showRandomCard(data[Math.floor(Math.random()*data.length)]);
    });
    document.getElementById("bottleTrigger").addEventListener("click", ()=>showRandomCard(kinkData[Math.floor(Math.random()*kinkData.length)]));
    function showRandomCard(item) {
        const c = userChoices[currentUser][item.id];
        const label = c ? ` (已标记：${getChoiceLabel(c)})` : "";
        document.getElementById("randomCardContent").innerHTML = `
            <span class="random-emoji">${item.emoji||"🎭"}</span>
            <div class="random-title">${item.name}</div>
            <div class="random-desc">${item.desc}${label}</div>
            <button class="random-close" onclick="document.getElementById('randomModal').style.display='none'">知道了 ✨</button>`;
        document.getElementById("randomModal").style.display="flex";
    }
    document.getElementById("randomModal").addEventListener("click", function(e){ if(e.target===this) this.style.display="none"; });

    document.getElementById("btnReset").addEventListener("click", ()=>{
        if(confirm(`重置「${currentUser==="A"?"我":"伴侣"}」的所有标记？`)) {
            userChoices[currentUser] = {};
            saveChoices(); refreshAll(); showToast("已重置");
        }
    });

    document.getElementById("btnUserA").addEventListener("click", ()=>{ currentUser="A"; refreshAll(); });
    document.getElementById("btnUserB").addEventListener("click", ()=>{ currentUser="B"; refreshAll(); });
    document.getElementById("categoryTabs").addEventListener("click", e=>{
        const tab = e.target.closest(".cat-tab");
        if(!tab) return;
        currentCategory = tab.dataset.cat;
        refreshAll();
        document.getElementById("cardsList").scrollIntoView({behavior:"smooth"});
    });

    function showToast(msg) {
        const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
        document.getElementById("toastContainer").appendChild(t);
        setTimeout(()=>t.remove(), 2100);
    }

    loadChoices(); refreshAll();
})();
</script>
</body>
</html>
